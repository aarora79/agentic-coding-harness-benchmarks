# =============================================================================
# SWE benchmark dataset - cli/cli (the GitHub CLI), v1
# =============================================================================
#
# A second repository for the harness, chosen to differ from
# mcp-gateway-registry in language and in kind: a Go command-line client with
# flag parsing, auth, terminal output and a REST/GraphQL client, where v2 is a
# Python service with React, nginx and Terraform around it. Its first job is the
# cross-repo check in issue #221: do model rankings, score levels and the
# swe-router rubric carry over to a codebase nobody tuned them on?
#
# The schema is identical to mcp-gateway-registry-v2.yaml and is documented in
# benchmarks/docs/harness-reference.md.
#
# -----------------------------------------------------------------------------
# How the 21 tasks were chosen
# -----------------------------------------------------------------------------
# 1. Every task is a real cli/cli issue closed as completed, with a merged fix
#    PR that changes Go source and shipped in a stable v2.x.y release.
#
# 2. Contamination rules: every fix merged on or after 2026-05-01, and every
#    issue was opened in 2026. Fixes span 2026-05-02 to 2026-09-29 and shipped
#    in v2.93.0 to v2.102.0. Long-running issues from 2020-2025, whose public
#    threads often sketch the solution, are excluded.
#
# 3. Each task's `ref` pins the stable release immediately BEFORE the one that
#    shipped the fix, so the defect or gap is present in the tree the agent
#    clones. `fixed-in-*` in each task's tags records that release.
#
# 4. Tiers follow v2's mix, 5 trivial / 5 low / 6 medium / 5 high, set from the
#    fix PR's shape and what the issue asks. They are provisional: as in v2, a
#    task is re-tiered if the first three-model run shows a mislabel.
#
# 5. `gh skill` is capped at 2 tasks of the 13 eligible, so no area dominates.
#    Areas: repo 4, pr 4, release 2, auth 2, project 2, skill 2, and one each
#    of copilot, extension, codespace, issue, search.
#
# The full selection, with 10 reserves and every excluded candidate and its
# reason, is in the cross-repo plan for issue #221.
#
# `ground_truth` records how upstream resolved each issue. It is
# reviewer-facing only and is NEVER given to the agent.
#
# Building and testing needs Go 1.26 or later; with the default
# GOTOOLCHAIN=auto, each ref fetches the toolchain its go.mod declares.
# =============================================================================

schema_version: "1.0"
name: cli-cli-swe-v1
title: GitHub CLI (cli/cli) - SWE tasks v1 (release-sourced, complexity-balanced)
description: >-
  Twenty-one software-engineering tasks drawn from real closed issues in
  cli/cli, the GitHub CLI, fixed in releases v2.93.0 through v2.102.0. Each
  task pins the release tag immediately before the fix landed, so the agent
  clones a tree in which the bug or gap is present. Five tasks each at trivial,
  low and high complexity and six at medium. Runs are instrumented for token
  usage, latency, and the number of LLM turns the agent took.
created: 2026-10-14
default_ref: "v2.101.0"
# Results folder name: cli/cli runs never share a folder or a table with v2.
output_scope: cli-cli-v1

metrics:
  - input_tokens          # prompt tokens sent to the model across the run
  - output_tokens         # completion tokens generated across the run
  - cache_read_tokens     # prompt tokens served from cache (if reported)
  - cache_creation_tokens # prompt tokens written to cache (if reported)
  - latency_seconds       # wall-clock time for the run
  - num_turns             # LLM calls (turns) the agent made to complete the task

complexity_levels:
  - trivial
  - low
  - medium
  - high

tasks:
  # ---------------------------------------------------------------------------
  # TRIVIAL COMPLEXITY (5)
  # ---------------------------------------------------------------------------

  - id: repo-create-reject-empty-name
    repo: https://github.com/cli/cli
    ref: "v2.100.0"
    complexity: trivial
    tags: [repo, go, cli, interactive-prompts, validation, fixed-in-2.101.0]
    problem_statement: |
      Interactive `gh repo create` accepts an empty repository name. When a
      user picks "Create a new repository on github.com from scratch" and
      leaves the "Repository name" prompt blank, gh carries on and asks for
      the owner, description, visibility, README, .gitignore and license,
      and then asks for confirmation to create "some-owner/". Only after the
      user confirms does it fail with:

        argument error: expected the "[HOST/]OWNER/REPO" format, got "some-owner/"

      The user has answered every prompt for nothing and must start the
      whole flow again.

      To reproduce: run `gh repo create`, choose to create from scratch,
      press Enter at the repository name prompt, and continue through the
      remaining fields.

      Expected behaviour: gh tells the user right away that the repository
      name is empty, instead of failing after the last prompt. Valid names
      must keep working as they do today.

      Cover the change with tests for an empty name.
    problem_issue_url: https://github.com/cli/cli/issues/14297
    clarifying_answers: |
      1. Interactive `gh repo create` accepts a blank repository name and only fails after every later prompt and the confirmation.
      2. Anyone creating a repository interactively with `gh repo create`.
      3. Go command-line tool, the GitHub CLI. No deadline.
      4. Trivial - one input check in the interactive create flow, plus tests.
    ground_truth:
      approach: >-
        Validate the repository name right after the interactive name prompt in
        the create command, returning "repository name cannot be blank" for
        empty or whitespace-only input before the owner or any later prompt
        runs. The check sits beside the existing repo-name parsing so the from-
        scratch, template and local-repository flows all share it.
      expectations:
        - "Rejects an empty repository name immediately after the name prompt, before owner, description, visibility or confirmation prompts."
        - "Treats whitespace-only input as blank."
        - "Leaves valid names and the existing OWNER/REPO parsing unchanged."
        - "Adds createRun test cases for empty and whitespace-only names that assert the error and that no later prompts run."
      reference_url: https://github.com/cli/cli/pull/14313

  - id: copilot-not-installed-trailing-newline
    repo: https://github.com/cli/cli
    ref: "v2.98.0"
    complexity: trivial
    tags: [copilot, go, cli, terminal-output, fixed-in-2.99.0]
    problem_statement: |
      `gh copilot` leaves the terminal in a messy state when GitHub Copilot
      CLI is not installed and the user declines to install it. gh prints
      the warning `! Copilot CLI was not installed` without a trailing
      newline, so the next shell prompt appears glued to the end of that
      line:

        ? GitHub Copilot CLI is not installed. Would you like to install it? No
        ! Copilot CLI was not installedbarsik@home:~$

      To reproduce:

      1. Make sure GitHub Copilot CLI is not installed.
      2. Run `gh copilot`.
      3. Answer `n` at the prompt "GitHub Copilot CLI is not installed.
         Would you like to install it? (Y/n)".

      Expected behaviour: the warning ends with a newline, so the shell
      prompt starts on its own line. The rest of the declined-install
      behaviour should stay the same.

      Cover the change with a test that asserts the exact output printed
      when the user declines the install.
    problem_issue_url: https://github.com/cli/cli/issues/14189
    clarifying_answers: |
      1. The "Copilot CLI was not installed" warning lacks a trailing newline, so the shell prompt lands on the same line.
      2. Users who run `gh copilot` without Copilot CLI installed and decline the install prompt.
      3. Go command-line tool, the GitHub CLI. No deadline.
      4. Trivial - a one-character output fix plus a test of the exact output.
    ground_truth:
      approach: >-
        Add a trailing newline to the warning printed when Copilot CLI
        installation is declined. Upstream also asserted the exact stderr output
        in the run-function table test, folding the existing execution-failure
        test into that table.
      expectations:
        - "Changes the declined-install warning so it ends with a newline."
        - "Leaves the warning text and the declined-install control flow otherwise unchanged."
        - "Adds or updates a test that asserts the exact output, including the trailing newline, for the declined-install case."
      reference_url: https://github.com/cli/cli/pull/14222

  - id: repo-set-default-unset-without-repo
    repo: https://github.com/cli/cli
    ref: "v2.101.0"
    complexity: trivial
    tags: [repo, go, cli, tty, flags, fixed-in-2.102.0]
    problem_statement: |
      `gh repo set-default --unset` fails when stdin is not a terminal, for
      example in a script or with redirected input:

        $ gh repo set-default --unset </dev/null
        repository required when not running interactively

        Usage:  gh repo set-default [<repository>] [flags]

      `--unset` removes whatever repository is currently the default, so a
      repository argument makes no sense for it. The command already
      accepts an argument with `--unset` but ignores it: with `upstream` as
      the current default, `gh repo set-default --unset origin` succeeds and
      unsets `upstream`.

      `gh repo set-default --view` already runs without a repository
      argument when not interactive. `--unset` should behave the same way.

      Expected behaviour: `gh repo set-default --unset` succeeds without a
      repository argument when not running interactively. A plain
      `gh repo set-default` with no argument and no flags, run without a
      terminal, should still fail with the existing "repository required"
      error.

      Cover the change with tests for non-interactive `--unset` and
      `--view` without an argument, and for the error case that must stay.
    problem_issue_url: https://github.com/cli/cli/issues/14521
    clarifying_answers: |
      1. `gh repo set-default --unset` demands a repository argument when stdin is not a terminal, though it never uses one.
      2. Users and scripts that run `gh repo set-default --unset` non-interactively.
      3. Go command-line tool, the GitHub CLI. No deadline.
      4. Trivial - one condition in the command's argument handling, plus tests.
    ground_truth:
      approach: >-
        Exempt `--unset` from the non-interactive "repository required" check in
        the set-default command constructor, the same way `--view` is already
        exempt. Constructor tests cover argument-free non-interactive `--unset`
        and `--view` and keep the error for a bare non-interactive invocation.
      expectations:
        - "Allows `gh repo set-default --unset` with no repository argument when stdin is not a TTY."
        - "Keeps the existing `--view` exemption working."
        - "Still returns \"repository required when not running interactively\" for a bare non-interactive call with no flags."
        - "Adds constructor test cases for the non-interactive `--unset` and `--view` paths and the preserved error."
      reference_url: https://github.com/cli/cli/pull/14540

  - id: pr-checks-all-cancelled-summary
    repo: https://github.com/cli/cli
    ref: "v2.95.0"
    complexity: trivial
    tags: [pr, go, cli, checks, terminal-output, fixed-in-2.96.0]
    problem_statement: |
      `gh pr checks` prints a blank summary line when every check on a pull
      request was cancelled. The command already has a "Some checks were
      cancelled" summary message, but it never appears in this case.

      To reproduce: run `gh pr checks <PR>` against a pull request whose
      only check runs are in the cancelled state, for example a single
      workflow run that was cancelled, with no passing, failing, pending or
      skipped checks alongside it.

      Expected behaviour: the summary line reads "Some checks were
      cancelled".

      Actual behaviour: gh prints an empty line where the summary should be.

      The summary for every other mix of check states should keep its
      current wording.

      Cover the change with a regression test for a pull request whose
      checks are all cancelled, asserting that the expected summary text is
      printed.
    problem_issue_url: https://github.com/cli/cli/issues/13680
    clarifying_answers: |
      1. `gh pr checks` prints a blank summary instead of "Some checks were cancelled" when all checks were cancelled.
      2. Anyone running `gh pr checks` on a pull request whose checks were all cancelled.
      3. Go command-line tool, the GitHub CLI. No deadline.
      4. Trivial - a one-line condition fix in the summary output, plus a regression test.
    ground_truth:
      approach: >-
        Add the cancelled count to the condition that gates the summary block in
        printSummary, so a cancelled-only result reaches the existing "Some
        checks were cancelled" branch. A new TestPrintSummary covers the
        cancelled-only case.
      expectations:
        - "Changes the summary guard in pkg/cmd/pr/checks/output.go so cancelled checks count toward showing the summary."
        - "Prints \"Some checks were cancelled\" when every check is cancelled."
        - "Leaves summaries for other check-state mixes unchanged."
        - "Adds a regression test for the cancelled-only case."
      reference_url: https://github.com/cli/cli/pull/13679

  - id: extension-uninstall-alias
    repo: https://github.com/cli/cli
    ref: "v2.93.0"
    complexity: trivial
    tags: [extension, go, cli, cobra, ux, fixed-in-2.94.0]
    problem_statement: |
      `gh extension install` adds an extension, but the command that undoes
      it is `gh extension remove`. Users who reach for the obvious opposite,
      `gh extension uninstall`, find that it does not exist. `uninstall` is
      a clearer antonym of `install` than `remove`.

      Users can work around this today by defining their own gh alias, but
      every user has to discover and set that up themselves.

      Add `gh extension uninstall` as an official command that does exactly
      what `gh extension remove` does. It should appear in the CLI help so
      users can find it. Removing or renaming `gh extension remove` would
      break existing scripts, so `remove` must keep working unchanged.

      Done looks like: `gh extension uninstall <name>` removes an installed
      extension the same way `gh extension remove <name>` does, and the help
      output for the command lists `uninstall`.

      Cover the change with tests, or explain clearly why the existing
      tests already cover it.
    problem_issue_url: https://github.com/cli/cli/issues/13598
    clarifying_answers: |
      1. Add `gh extension uninstall` as an official equivalent of `gh extension remove`, shown in help.
      2. Users who manage gh extensions and expect `uninstall` to pair with `install`.
      3. Go command-line tool, the GitHub CLI. No deadline; `remove` must not break.
      4. Trivial - a small declarative change to one command definition.
    ground_truth:
      approach: >-
        Register `uninstall` as a cobra alias on the existing `remove`
        subcommand of `gh extension`, so it shares the same RunE and cobra lists
        it under ALIASES in `--help`. `remove` stays the canonical name and no
        docs or acceptance scripts change.
      expectations:
        - "Adds `uninstall` as an alias of the `gh extension remove` subcommand rather than a duplicate command."
        - "Keeps `gh extension remove` working as the canonical name."
        - "Makes the alias visible in the command's help output."
        - "Either adds a test that invokes the alias or justifies relying on the existing remove tests."
      reference_url: https://github.com/cli/cli/pull/13599

  # ---------------------------------------------------------------------------
  # LOW COMPLEXITY (5)
  # ---------------------------------------------------------------------------

  - id: pr-merge-delete-branch-owner-case
    repo: https://github.com/cli/cli
    ref: "v2.100.0"
    complexity: low
    tags: [pr, go, cli, git, remotes, fixed-in-2.101.0]
    problem_statement: |
      `gh pr merge <N> --delete-branch` deletes the local branch but leaves
      the pull request's branch on GitHub when the owner name in
      `remote.origin.url` uses different letter case from the owner's
      canonical GitHub login. The command prints no error, so the user only
      notices later.

      To reproduce:

      1. Turn OFF "Automatically delete head branches" in the repository's
         pull request settings.
      2. Clone the repository with a remote URL whose owner differs only in
         letter case from the owner's GitHub login.
      3. Push a branch to that same repository and open a pull request.
      4. Run `gh pr merge <N> --delete-branch --squash` (or `--merge`).
      5. Run `git fetch --all --prune`.

      gh reports that it merged the pull request and deleted the local
      branch, but the remote branch still exists and the fetch shows no
      `[deleted]` line. With automatic head-branch deletion turned on the
      branch disappears, but only because GitHub removed it.

      Expected behaviour: for a pull request whose head branch lives in the
      same repository, `--delete-branch` deletes the remote branch
      regardless of how the owner's name is cased in the local remote URL.

      Cover the change with a regression test for an owner-case mismatch.
    problem_issue_url: https://github.com/cli/cli/issues/14404
    clarifying_answers: |
      1. `gh pr merge --delete-branch` skips deleting the remote branch when the remote URL's owner casing differs from GitHub's.
      2. Users whose git remote URL spells the repository owner with different letter case, without auto-delete enabled.
      3. Go command-line tool, the GitHub CLI. No deadline.
      4. Low - a small logic change in the merge command and its query, plus a regression test.
    ground_truth:
      approach: >-
        The merge command decided whether a PR was cross-repository by comparing
        the head repository owner login with the owner parsed from the git
        remote, case-sensitively. Upstream dropped that string comparison: the
        merge context now requests the PR's `isCrossRepository` field from
        GitHub and trusts it, and stops requesting `headRepositoryOwner`. A unit
        test and the merge acceptance script cover the casing-only mismatch.
      expectations:
        - "Identifies the cross-repository check in the pr merge command as the reason remote deletion is skipped."
        - "Stops treating an owner-case mismatch as a cross-repository PR, preferably by using GitHub's isCrossRepository rather than comparing login strings."
        - "Still skips remote branch deletion for genuine fork pull requests."
        - "Adds a regression test where the remote owner differs only in case and asserts the remote branch is deleted."
      reference_url: https://github.com/cli/cli/pull/14429

  - id: pr-view-json-number-on-issue
    repo: https://github.com/cli/cli
    ref: "v2.92.0"
    complexity: low
    tags: [pr, go, cli, json-output, api, fixed-in-2.93.0]
    problem_statement: |
      `gh pr view <N> --json number` prints `{"number":N}` and exits 0 even
      when N is an issue number rather than a pull request. Scripts that use
      this command to check whether a number is a pull request get false
      positives for issues.

      To reproduce, pick an issue number (not a PR) in a repository:

        gh pr view 1099 --json number; echo "exit: $?"
        {"number":1099}
        exit: 0

      Requesting any other pull-request field behaves correctly:

        gh pr view 1099 --json number,headRefName; echo "exit: $?"
        exit: 1

      With only `number` requested, gh answers without asking GitHub
      whether N is a pull request at all.

      Expected behaviour: `gh pr view <N> --json number` exits non-zero
      when N is not a pull request, the same as it does when other fields
      are requested. When N is a pull request the output should stay
      `{"number":N}`.

      Cover the change with tests.
    problem_issue_url: https://github.com/cli/cli/issues/13319
    clarifying_answers: |
      1. `gh pr view <N> --json number` succeeds for issue numbers because gh never checks that N is a pull request.
      2. Scripts and users that use `gh pr view --json number` to tell pull requests from issues.
      3. Go command-line tool, the GitHub CLI. No deadline.
      4. Low - a small change to how pull requests are looked up by number, plus test updates.
    ground_truth:
      approach: >-
        Remove the numberFieldOnly shortcut in pkg/cmd/pr/shared/finder.go that
        returned a synthetic PullRequest when only `number` was requested, so
        the finder always queries the API and fails for numbers that are not
        pull requests. The finder test that asserted the shortcut was deleted.
      expectations:
        - "Makes a number-only `--json number` lookup hit the API so non-PR numbers produce an error and non-zero exit."
        - "Keeps `{\"number\":N}` output for real pull requests."
        - "Removes or updates tests that asserted the no-API shortcut."
        - "Adds or keeps a test showing an issue or missing number now fails."
      reference_url: https://github.com/cli/cli/pull/13327

  - id: project-item-add-output-non-tty
    repo: https://github.com/cli/cli
    ref: "v2.97.0"
    complexity: low
    tags: [project, go, cli, tty, automation, fixed-in-2.98.0]
    problem_statement: |
      `gh project item-add` adds the item and exits 0, but prints nothing at
      all when stdout is not a TTY. Run it with output redirected:

        gh project item-add <project-number> --owner <owner> \
          --url <issue-url> > output.txt

      The item lands in the project, yet output.txt is empty. In an
      interactive terminal the command prints "Added item", so the success
      message only exists for humans.

      This hurts scripts and coding agents. A caller that sees no output
      cannot tell a successful mutation from a command that did nothing
      useful, so agents retry the call. In repeated evaluations the same
      one-line task took anywhere from 2 to 9 tool calls, because runs kept
      invoking `gh project item-add` after the first call had already
      succeeded.

      Done looks like this: a successful non-TTY run prints a short, stable
      confirmation, ideally one that includes the identifier of the added
      project item. TTY output should stay as it is today, and the existing
      `--format json` output must keep working for callers that want the
      full item. Cover the change with tests for both TTY and non-TTY output.
    problem_issue_url: https://github.com/cli/cli/issues/14055
    clarifying_answers: |
      1. `gh project item-add` prints no confirmation when stdout is not a TTY, so callers cannot observe success.
      2. Scripts, CI jobs and coding agents that run gh without a terminal and then retry a call that already worked.
      3. Go command-line tool, the GitHub CLI. Keep TTY output and `--format json` unchanged. No deadline.
      4. Low - an output change in one command plus tests.
    ground_truth:
      approach: >-
        Upstream changed the item-add result printer so that a non-TTY run
        writes the ID of the created ProjectV2 item (taken from the existing
        mutation result, so no extra API call) instead of returning silently.
        TTY output still prints "Added item" and `--format` output is unchanged;
        the tests were updated to assert both modes.
      expectations:
        - "Changes the item-add output path so a successful non-TTY run prints a terse confirmation containing the added item's ID."
        - "Keeps the \"Added item\" message for TTY output and leaves `--format json` output unchanged."
        - "Uses data already returned by the add mutation rather than making an extra API request."
        - "Adds or updates tests in the item-add package covering TTY, non-TTY and JSON output."
      reference_url: https://github.com/cli/cli/pull/14056

  - id: release-create-404-scope-blame
    repo: https://github.com/cli/cli
    ref: "v2.97.0"
    complexity: low
    tags: [release, go, cli, auth, error-handling, fixed-in-2.98.0]
    problem_statement: |
      When `gh release create` gets an HTTP 404, it checks whether the token
      carries the `workflow` scope. If it decides the scope is missing, it
      replaces the error with a hint to run `gh auth refresh -s workflow`.
      That check reports "no workflow scope" for almost every OAuth token,
      including tokens that do hold the scope.

      Two things go wrong. Users who already have `workflow` are told to
      request it, and refreshing changes nothing. Worse, the real cause of
      the 404 is hidden: a typo in the repo name, a repo that does not
      exist, or missing push access all show up as a scope problem.

      Reproduce with an OAuth token that has `workflow`:

        GH_DEBUG=api GH_REPO=cli/definitely-not-a-real-repo-wm-9f3a \
          gh release create v0.0.0 --notes test

      The debug log shows `X-Oauth-Scopes: gist, project, read:org, repo,
      user, workflow` on the response, yet gh prints the scope hint and
      drops the 404.

      Expected: when the token has `workflow`, gh reports the underlying
      error, such as `HTTP 404: Not Found (...)`. The hint should still
      appear when the token truly lacks the scope, since a tag that changes
      workflow files does 404 without it. Cover the change with tests.
    problem_issue_url: https://github.com/cli/cli/issues/14063
    clarifying_answers: |
      1. `gh release create` blames a missing `workflow` scope for every 404, even when the token has it, and hides the real error.
      2. Anyone creating releases with an OAuth token who hits a 404 (wrong repo, no push access, and so on).
      3. Go command-line tool, the GitHub CLI. Keep the hint for tokens that really lack `workflow`. No deadline.
      4. Low - a parsing bug in one helper plus tests.
    ground_truth:
      approach: >-
        The `X-Oauth-Scopes` header is comma-space separated, and
        `tokenHasWorkflowScope` in pkg/cmd/release/create/http.go split it on
        "," without trimming, so only the first scope could ever match. Upstream
        trims each element before comparing, matching `generateScopesSuggestion`
        in api/client.go, and added a new http_test.go plus fixed test stubs in
        create_test.go to use the real header format.
      expectations:
        - "Finds the workflow-scope check used on the 404 path of release create and identifies the unhandled space after each comma."
        - "Parses the scopes header so `workflow` is detected in any position, with or without surrounding whitespace."
        - "Still shows the workflow-scope hint when the token genuinely lacks the scope, and surfaces the raw 404 otherwise."
        - "Adds tests using realistic comma-space headers, covering scope present, scope absent and edge cases such as an empty header."
      reference_url: https://github.com/cli/cli/pull/14065

  - id: pr-comment-attach-ghu-tokens
    repo: https://github.com/cli/cli
    ref: "v2.101.0"
    complexity: low
    tags: [pr, go, cli, auth, attachments, fixed-in-2.102.0]
    problem_statement: |
      `gh pr comment --attach` refuses GitHub App user-to-server tokens
      (the `ghu_` prefix) before it sends any request, and reports a
      credential fault. The attachment upload endpoint accepts these tokens,
      so gh rejects a credential that works.

      This matters most inside GitHub Copilot cloud agent sessions, whose
      credential is a `ghu_` token. There, `gh pr comment --attach` can
      never work, even though the same upload with the same token succeeds
      through curl.

      To reproduce, put a `ghu_` token in `GH_TOKEN` and run:

        gh pr comment <n> --attach file.png

      It fails in the client with no request sent. Then post the same file
      straight to the uploads URL with curl, using the header
      `Authorization: token $GH_TOKEN`; the server answers HTTP 201 with an
      attachment URL. (The endpoint wants the `token` scheme; `Bearer`
      returns 404.)

      Expected: `--attach` uploads the file when the token is a `ghu_`
      token the server accepts, and the server's own error comes back when
      it refuses one. Behaviour for the token types that already work must
      not change. Cover the change with tests.
    problem_issue_url: https://github.com/cli/cli/issues/14495
    clarifying_answers: |
      1. `--attach` rejects `ghu_` (GitHub App user-to-server) tokens client-side, although the upload endpoint accepts them.
      2. Users authenticating with `ghu_` tokens, notably GitHub Copilot cloud agent sessions.
      3. Go command-line tool, the GitHub CLI. Do not change behaviour for gho_, ghp_ or github_pat_ tokens. No deadline.
      4. Low - widening one client-side token check plus tests.
    ground_truth:
      approach: >-
        Upstream added the GitHub App user token type (`ghu_`) to
        `uploadTokenTypes` in internal/attachments/client.go so the upload
        endpoint, not the client, decides whether a given `ghu_` token is
        acceptable. The client tests were updated so a `ghu_` token is no longer
        expected to fail client-side, and the bundled gh skill doc was updated
        to match.
      expectations:
        - "Locates the client-side allowlist of token types that gates attachment uploads."
        - "Allows `ghu_` tokens through so the request reaches the upload endpoint with the `token` authorization scheme."
        - "Keeps rejecting token types that are still unsupported, and keeps existing gho_, ghp_ and github_pat_ behaviour."
        - "Updates or adds tests asserting a `ghu_` token is accepted by the client check."
      reference_url: https://github.com/cli/cli/pull/14516

